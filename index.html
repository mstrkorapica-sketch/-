<div class="app">

<script>
const CONFIG={title:"📘 اختبار القانون الإطار",subtitle:"4 فصول · 160 سؤالاً · اختر فصلاً وابدأ التحدي",timePerQuestion:60,shuffleOptions:true};

const CHAPTERS=[
{id:'ch1',icon:'📗',title:'الفصل الأول: الرؤية الاستراتيجية 2015-2030',description:'الشعارات والإنصاف والتعليم الأولي والإدماج',questions:[
{q:'ما هو الشعار أو الأساس الذي تقوم عليه الرؤية الاستراتيجية للإصلاح 2030-2015؟',o:['من أجل مدرسة الجودة والتميز فقط.','من أجل مدرسة الإنصاف والجودة والارتقاء.','من أجل مدرسة المواطنة والدمقرطة.','من أجل مدرسة رقمية وذكية.'],a:1},
{q:'يعتبر "الإنصاف وتكافؤ الفرص" في الرؤية الاستراتيجية:',o:['رهاناً سياسياً ومجتمعياً حاسماً لتحقيق الإدماج والتضامن.','مسؤولية تقع على عاتق القطاع الخاص فقط.','هدفاً يمكن تحقيقه في الأمد البعيد فقط.','إجراءً إدارياً لتنظيم التسجيل في المؤسسات.'],a:0},
{q:'ما هي الفئة العمرية المستهدفة لتحقيق "الولوج التام" لجميع الأطفال المغاربة؟',o:['من 6 إلى 15 سنة.','من 5 إلى 12 سنة.','من 4 إلى 15 سنة.','من 3 إلى 6 سنوات.'],a:2},
{q:'كيف تنظر الرؤية الاستراتيجية إلى "التعليم الأولي"؟',o:['كمرحلة غير إلزامية ولا تؤثر على المسار الدراسي.','كقاعدة أساسية لكل إصلاح تربوي وتيسير للنجاح الدراسي.','كقطاع يجب أن يقتصر على القطاع الخاص.','كمرحلة ثانوية يمكن تأجيلها.'],a:1},
{q:'ما هو الأفق الزمني الذي حددته الرؤية لتعميم تعليم أولي بمواصفات الجودة؟',o:['في حدود السنوات العشر الجارية.','في حدود السنوات الخمس الجارية.','في حدود السنوات العشرين الجارية.','في حدود ثلاث سنوات.'],a:0},
{q:'ما هي الفئة العمرية المستهدفة بالتعليم الأولي حسب الرؤية الاستراتيجية؟',o:['من 3 إلى 5 سنوات.','من 5 إلى 6 سنوات.','من 4 إلى 6 سنوات.','من 4 إلى 5 سنوات.'],a:2},
{q:'ما هو النموذج البيداغوجي المطلوب اعتماده في التعليم الأولي؟',o:['نموذج موحد الأساليب والغايات.','نموذج يعتمد فقط على التعلم الرقمي.','نموذج يعتمد على التلقين المباشر.','نموذج موحد الأهداف، متنوع الأساليب.'],a:3},
{q:'كيف تتعامل الرؤية مع الأوساط القروية والمناطق ذات الخصاص؟',o:['بتخويلها "تمييزاً إيجابياً" لتيسير تعليم ذي فرص متكافئة.','بالاكتفاء بتوفير التعليم الأساسي.','بتشجيع التعليم الخاص بها فقط.','بإغلاق المدارس الصغيرة وتوجيه التلاميذ للمدن.'],a:0},
{q:'ما هو الهدف من إشراك المؤسسات الاقتصادية الكبرى في المناطق القروية؟',o:['تمويل بناء المدارس فقط.','تعزيز وتوسيع تجارب إنشاء مساكن جيدة للأطر التربوية وتمويل برامج التربية غير النظامية.','توظيف التلاميذ مباشرة بعد التخرج.','تحويل المدارس إلى مؤسسات ربحية.'],a:1},
{q:'كيف تتعامل الرؤية مع الأطفال في وضعية إعاقة؟',o:['عبر عزلهم في مؤسسات متخصصة فقط.','عبر إعفائهم من التعليم الإلزامي.','عبر إدماجهم في المدارس لإنهاء وضعية الإقصاء والتمييز مع توفير المستلزمات الكفيلة بإنصافهم.','عبر تخصيص حصص دراسية ليلية لهم.'],a:2},
{q:'ما هو الأفق الزمني لوضع "مخطط وطني للتربية الدامجة"؟',o:['على المدى القريب (وضعه) والمدى المتوسط (تفعيله).','على المدى البعيد (2030).','على المدى المتوسط فقط.','فوراً دون تخطيط مسبق.'],a:0},
{q:'كيف يتم تكييف الامتحانات للأشخاص في وضعية إعاقة؟',o:['إعفاؤهم من الامتحانات.','إخضاعهم لنفس الامتحانات دون أي تعديل.','تكييف الامتحانات وظروف اجتيازها مع حالاتهم.','تخصيص امتحانات شفهية فقط لهم.'],a:2},
{q:'ما هو الهدف من "مدرسة الفرصة الثانية"؟',o:['استقبال التلاميذ المتفوقين.','تدريس اللغات الأجنبية فقط.','تكوين المدرسين.','إعادة إدماج اليافعين والشباب المنقطعين في التعليم النظامي أو التكوين المهني.'],a:3},
{q:'كيف يتم التعامل مع "الدعم التربوي المكثف"؟',o:['كحق للمتعلمين المتعثرين دراسياً ويُدمج في المناهج والبرامج والزمن الدراسي.','كخدمة إضافية اختيارية.','كعقاب للتلاميذ المشاغبين.','كخدمة مخصصة للقطاع الخاص.'],a:0},
{q:'ما هو الشرط الأساسي لإحداث مسار للتعليم المهني من الإعدادي؟',o:['إلغاء التعليم العام.','مراجعة شاملة لشروط الانتقاء والولوج ومراجعة نظام التوجيه.','تخصيصه للتلاميذ الراسبين فقط.','تحويل جميع تلاميذ الإعدادي إليه.'],a:1},
{q:'كيف تنظر الرؤية إلى الجامعة ومؤسسات التعليم العالي؟',o:['كمؤسسات تابعة إدارياً ومالياً للوزارة.','كمؤسسات يجب خصخصتها بالكامل.','كمؤسسات ذات استقلالية فعلية إدارية ومالية وأكاديمية تربطها علاقة تعاقد مع القطاع الحكومي.','كمؤسسات تهدف للربح فقط.'],a:2},
{q:'ما هو الهدف من تأهيل "التعليم العتيق"؟',o:['إلغاؤه ودمجه في التعليم العام.','تحويله إلى تعليم خاص.','فصله تماماً عن التعليم العمومي.','مواصلة تأهيله مع الحرص على وحدة المدرسة وتطبيق متطلبات التعليم الإلزامي.'],a:3},
{q:'ما هو الأفق الزمني للقضاء على الأمية؟',o:['على المدى المتوسط.','على المدى القصير (3 سنوات).','على المدى البعيد (2030).','لا يوجد أفق زمني محدد.'],a:0},
{q:'ما هو الهدف من "مراكز الدعم النفسي والاجتماعي"؟',o:['معاقبة التلاميذ.','التطوير والتعميم التدريجي لدعم المتعلمين نفسياً واجتماعياً.','استقبال الأولياء فقط.','تدريب المدرسين.'],a:1},
{q:'كيف تتعامل الرؤية مع "التعليم الخاص"؟',o:['كمنافس للتعليم العمومي يجب الحد منه.','كقطاع يجب إلغاؤه.','كشريك للتعليم العمومي في التعميم وتحقيق الإنصاف.','كقطاع مستقل تماماً عن أهداف المنظومة.'],a:2},
{q:'ما هي المهمة الأساسية للدولة تجاه التعليم الخاص؟',o:['تمويله بالكامل.','إدارته مباشرة.','تركه دون رقابة.','الترخيص وإصدار القوانين المنظمة وضمان معايير الجودة والمراقبة والتقييم.'],a:3},
{q:'ما هو الهدف من "مشروع المؤسسة" في سياق تعبئة المجتمع؟',o:['توسيع قنوات التعبئة وتأمين تملك الفاعلين لأهداف الإصلاح.','بناء مؤسسات جديدة.','تحديد ميزانية الوزارة.','تعيين المدرسين.'],a:0},
{q:'كيف تساهم الرؤية في تعزيز "التعليم عن بعد"؟',o:['كبديل كلي للتعليم الحضوري.','باعتباره مكملاً للتعلم الحضوري وعاملاً في تنمية ثقافة العمل التشاركي.','كخدمة للقطاع الخاص فقط.','كحل مؤقت للأزمات.'],a:1},
{q:'ما هو الهدف من إحداث "شبكات للتربية والتكوين" في القرى؟',o:['تجميع التلاميذ في مدارس داخلية فقط.','تقليل عدد المدرسين.','إنجاز مشاريع مشتركة وتوسيع مهامها لتشمل الوساطة في سوق الشغل والتدبير المحلي للكفاءات.','تحويل المدارس إلى مراكز تدريب مهني فقط.'],a:2},
{q:'كيف يتم التعامل مع مساهمة "الأسرة" في الرؤية؟',o:['كطرف خارجي لا علاقة له بالمدرسة.','بالسماح لها بالتدريس في الفصول.','بتحميلها المسؤولية الكاملة عن النتائج.','بإرساء آليات لتمكينها من التتبع اليقظ لأبنائها ومواكبة تحصيلهم وإشراكها في تدبير المؤسسة.'],a:3},
{q:'ما هو دور "مدرسة أمهات وآباء وأولياء المتعلمين"؟',o:['تنظيم دورات تكوينية للأسر (محاربة الأمية، التوعية، المساعدة على استعمال الوسائل الديداكتيكية).','تدريب الأولياء ليصبحوا مدرسين.','جمع الأموال للمدرسة.','إدارة شؤون المؤسسة.'],a:0},
{q:'كيف تنظر الرؤية إلى "الجماعات الترابية" في دعم المدرسة؟',o:['كجهات يجب أن تكتفي بالدعم المالي.','بإشراكها في وضع قضايا البيئة المدرسية في صلب النقاش المحلي وتقديم دعم منتظم للمدرسة.','بإعفائها من أي مسؤولية.','بتفويضها إدارة المدارس بالكامل.'],a:1},
{q:'ما هو الهدف من "التكوين بالتناوب" في التعليم المهني؟',o:['تدريس جميع المواد باللغة الأجنبية.','تقليل عدد ساعات الدراسة.','المزاوجة بين التكوين النظري في المؤسسة والتطبيق الميداني في المقاولة.','الاستغناء عن المدرسين.'],a:2},
{q:'ما هي "الباكالوريا المهنية"؟',o:['شهادة تُمنح لكل تلاميذ التعليم الثانوي.','امتحان للولوج إلى التكوين المهني فقط.','شهادة للتعليم العتيق.','مسلك مهني في الثانوي التأهيلي يمكن المتعلمين ذوي الميول من التوجيه نحو سوق الشغل أو التعليم العالي.'],a:3},
{q:'كيف يتم التعامل مع "الأطفال في وضعيات خاصة"؟',o:['وضع برامج تتلاءم وخصوصيات الفئات المستهدفة ووضعياتها الاجتماعية.','إقصاؤهم من البرامج.','توجيههم فقط للمؤسسات الخاصة.','إدماجهم مباشرة في المدارس دون دعم.'],a:0},
{q:'ما هو الهدف من "التمييز الإيجابي" في تمويل التعليم؟',o:['تفضيل المدارس الخاصة.','تأهيل التعليم بالوسط القروي لتقليص الفوارق الترابية وتحقيق المساواة.','تقليل ميزانية التعليم.','تمويل المدارس في المدن الكبرى فقط.'],a:1},

{q:'كيف يتم إدماج "تكنولوجيا الإعلام والاتصال" في المنظومة؟',o:['بالاكتفاء بتدريس الإعلاميات كمادة.','بجعلها شرطاً حاسماً في التجديد عبر تجهيز المؤسسات ورقمنة المضامين وإدماجها كلياً في التدبير والتكوين.','بمنع استعمالها داخل الفصول.','بتخصيصها للقطاع الخاص.'],a:1},
{q:'ما هو الهدف من تنمية "التعلم عن بعد"؟',o:['الاستغناء عن التعليم الحضوري.','تقليل عدد المدرسين.','باعتباره مكملاً للتعلم الحضوري وعاملاً في تنمية ثقافة العمل التشاركي.','تحويل التعليم إلى قطاع رقمي فقط.'],a:2},

{id:'ch3',icon:'📙',title:'الفصل الثالث: الاندماج والمواطنة ومجتمع المعرفة',description:'التعلم مدى الحياة واللغات والبحث العلمي والثقافة',questions:[
{q:'ما هو الخيار الاستراتيجي الذي يمثله بناء "مدرسة الارتقاء الفردي والمجتمعي"؟',o:['خيار استراتيجي ضمن خارطة طريق الإصلاح التعليمي وإحدى غاياته المثلى.','خيار تكميلي غير أساسي.','خيار يقتصر على التعليم العالي.','خيار يهدف للربح المادي فقط.'],a:0},
{q:'كيف يتم تحقيق "ملاءمة التعلمات مع حاجات البلاد"؟',o:['بالاكتفاء بالمناهج النظرية الحالية.','بتوفير تعليم وتكوين ذي جودة وملائم للحياة العملية وتطوير مسالك التكوين بالتناوب بين مؤسسات التكوين والمقاولة.','بتقليل عدد التكوينات المهنية.','بتوجيه جميع المتعلمين نحو التعليم العالي فقط.'],a:1},
{q:'ما هو الهدف من "مرصد الملاءمة بين المهن والتكوينات"؟',o:['مراقبة أداء المدرسين.','تقليل عدد الجامعات.','استثمار توصياته في رسم استراتيجية التكوين بمؤسسات التعليم العالي والتكوين المهني.','إلغاء التكوين المهني.'],a:2},
{q:'ما هي مسؤولية الفاعلين الاقتصاديين في "الاندماج الاقتصادي"؟',o:['الاكتفاء بدفع الضرائب.','تمويل المدارس الخاصة فقط.','منع التدريب في مؤسساتهم.','إدراج خطة تشغيل الشباب ضمن أولوياتهم وتأهيل الفضاء المقاولاتي لاستقبال الكفاءات الجديدة وإدماجها.'],a:3},
{q:'كيف تنظر الرؤية إلى المدرسة في علاقتها بالثقافة؟',o:['كحامل للثقافة وناقل لها ومختبر للإسهام في إنتاجها ونشرها.','كفضاء لاستهلاك الثقافة فقط.','كفضاء منعزل عن المحيط الثقافي.','كمسؤول عن تدريس التاريخ فقط.'],a:0},
{q:'كيف يتم إدماج "المكون الثقافي" في المنظومة؟',o:['بالاكتفاء بالأنشطة الموازية.','بإدراجه الفعلي ضمن البرامج والتكوينات المدرسية والجامعية وتطوير مجزوءات وشعب جامعية مخصصة للشأن الثقافي.','بمنع الفنانين من دخول المدارس.','بتدريس الثقافة الأجنبية فقط.'],a:1},
{q:'ما هو الهدف من "التربية على القيم الديمقراطية والمواطنة"؟',o:['حشو أذهان المتعلمين بالقوانين.','تخصيصها للمرحلة الثانوية فقط.','جعلها خياراً استراتيجياً لا محيد عنه لترسيخ مجتمع المواطنة ومحاربة السلوكات اللامدنية.','إلغاء الأنشطة التطوعية.'],a:2},
{q:'كيف يتم تعزيز "الممارسة الديمقراطية" داخل المؤسسات؟',o:['بمنع التلاميذ من التعبير عن آرائهم.','بالاكتفاء بتدريس مادة التربية المدنية.','بتعيين ممثلي التلاميذ من طرف الإدارة.','بتعزيز مراكز الإنصات وإرساء آليات للوساطة وتمكين المتعلمين من المشاركة الفعلية في تدبير الحياة المدرسية.'],a:3},
{q:'كيف يتم تشجيع "الخدمة التطوعية" للمتعلمين؟',o:['بوضع صيغ محفزة للانخراط في برامج التربية البيئية أو الطرقية والمبادرات الاجتماعية مع احتسابها في تقييم مردودهم الدراسي.','بإجبارهم على ذلك.','بمنحهم شهادات فقط دون عمل.','بتخصيصها للعطل الصيفية فقط.'],a:0},
{q:'ما هو الهدف من "استراتيجية شمولية للتعلم مدى الحياة"؟',o:['إلغاء التعليم النظامي.','كسب رهان استدامة تعميم المعرفة والاستثمار بشكل أفضل في تنمية الرأسمال البشري.','تخصيص التعليم للكبار فقط.','تقليل عدد سنوات الدراسة.'],a:1},
{q:'كيف يتم توسيع الخريطة المعرفية للتعلم مدى الحياة؟',o:['بالاكتفاء بالكتب المدرسية.','بمنع استخدام الإنترنت.','بإدماج البرمجيات التربوية الإلكترونية وتعزيز التعلمات المستندة إلى البرامج الرقمية وتوفير الفضاءات متعددة الوسائط.','بتقليل عدد المكتبات.'],a:2},
{q:'كيف يتم "التصديق على المكتسبات المعرفية والمهنية"؟',o:['بالاكتفاء بشهادات التعليم النظامي.','بترك الأمر للمقاولات الخاصة.','بإلغاء الشهادات المهنية.','باعتماد نظام موحد تشرف عليه هيئة وطنية مستقلة للتصديق على المكتسبات وتطويرها.'],a:3},
{q:'ما هي المداخل الأربعة للانخراط في "اقتصاد ومجتمع المعرفة"؟',o:['تكنولوجيا الإعلام والاتصال، اللغات الأكثر استعمالاً، البحث العلمي والابتكار، التفوق والتميز الدراسي.','الرياضة، الفن، الموسيقى، المسرح.','الفلاحة، الصناعة، التجارة، السياحة.','التاريخ، الجغرافيا، الفلسفة، الاجتماعيات.'],a:0},
{q:'كيف يتم إدماج "تكنولوجيا الإعلام والاتصال" في المدرسة؟',o:['بالاكتفاء بتدريس الإعلاميات كمادة نظرية.','بإعداد برنامج وطني لتجهيز المؤسسات وربطها بالإنترنت وتزويد المكتبات بالموارد الرقمية وإدماجها في جميع مستويات التدبير.','بمنع استعمال الهواتف الذكية.','بتخصيصها للمدارس الخاصة.'],a:1},
{q:'ما هو الهدف من "رقمنة الكتاب المدرسي"؟',o:['الاستغناء عن المدرسين.','تقليل تكلفة الطباعة فقط.','مواكبة العصر وتنويع مصادر المعرفة وتعزيز التعلم الذاتي.','منع القراءة الورقية.'],a:2},
{q:'كيف تساهم المدرسة في "تحدي إتقان اللغات الأكثر استعمالاً"؟',o:['بتدريس اللغة العربية فقط.','بمنع تدريس اللغات الأجنبية.','بالاكتفاء بالترجمة الآلية.','بتمكين المتعلمين من هذه اللغات لتوطيد انخراط البلاد في اقتصاد ومجتمع المعرفة وتيسير التواصل وتقوية نجاعة العمل الدبلوماسي.'],a:3},
{q:'كيف يتم "توجيه البحث العلمي نحو تنمية الكفاءات البشرية"؟',o:['بربط التعلم باستراتيجيات البحث والابتكار منذ المراحل الأولى وتنمية المشاريع التربوية وتشجيع الإبداع وحرية الاختيار.','بالتركيز على البحث النظري فقط.','بإلغاء البحث التطبيقي.','بتقليل ميزانية البحث العلمي.'],a:0},
{q:'كيف يتم "رعاية النبوغ والتفوق" في المدرسة؟',o:['بتجاهل المتفوقين والتركيز على المتعثرين.','باعتبارها إحدى آليات الارتقاء بمستويات التعلم عبر اعتماد آليات للاستكشاف المبكر وتكريم المتميزين وتعميم منح الاستحقاق.','بفصل المتفوقين في مدارس خاصة بهم فقط.','بالاكتفاء بمنحهم نقطاً عالية.'],a:1},
{q:'ما هو الهدف من تفعيل "ثانويات التميز"؟',o:['استقبال التلاميذ المتعثرين.','تقليل عدد التلاميذ في الثانويات العادية.','تكريس التنافس الدراسي الشريف لفائدة المتفوقين على أساس معايير النزاهة والاستحقاق وتكافؤ الفرص.','تحويل الثانويات إلى مؤسسات خاصة.'],a:2},
{q:'كيف يتم "تشجيع النبوغ في مجال البحث واستعمال التكنولوجيا"؟',o:['بمنع الطلبة من البحث.','بالاكتفاء بالدروس النظرية.','بتقليل عدد المختبرات.','بإرساء ديناميكية جديدة للمؤسسات قوامها برامج ومشاريع للبحث والاكتشاف وإحداث شبكات للمهتمين بالبحث وتشجيع محاضن المقاولات المبدعة.'],a:3},
{q:'ما هي الثروة الحقيقية للمغرب التي تركز عليها الرؤية؟',o:['العنصر البشري (الرأسمال البشري).','الموارد الطبيعية.','الموارد المالية.','الموقع الجغرافي.'],a:0},
{q:'كيف تساهم المدرسة في "لحاق بلادنا بركب البلدان الصاعدة"؟',o:['بالاكتفاء بتخريج أطر إدارية.','بتعزيز الاستثمارات العمومية في التربية وإقرار إصلاحات عميقة وتقوية الجسور بين مؤسسات التكوين والبحث والمقاولات.','بتقليل ميزانية التعليم.','بالاعتماد على المساعدات الخارجية فقط.'],a:1},
{q:'كيف يتم "تقوية الاندماج السوسيو-ثقافي" للمتعلمين؟',o:['بفرض ثقافة واحدة على الجميع.','بمنع الأنشطة الفنية.','بجعل الثقافة بعداً عضوياً من أبعاد وظائف المدرسة وضمان ولوج سلس ومنصف للثقافة وترسيخ التعددية الثقافية.','بتدريس الثقافات الأجنبية فقط.'],a:2},
{q:'ما هو الهدف من "إرساء آليات للتنسيق بين مؤسسات التربية والبنيات الثقافية"؟',o:['تقليل عدد الفعاليات الثقافية.','تحويل المدارس إلى مراكز ثقافية فقط.','إلغاء الأنشطة الموازية.','الاستغلال المتبادل للفضاءات وتخطيط وإنجاز أنشطة مشتركة (مسرح، موسيقى، سينما).'],a:3},
{q:'كيف يتم "ترسيخ مجتمع المواطنة والمساواة" في المدرسة؟',o:['بإدماج المقاربة القيمية والحقوقية في صلب المناهج والبرامج وتعزيز التربية على ثقافة المساواة ومحاربة التمييز والصور النمطية.','بالاكتفاء بتدريس مادة التربية الإسلامية.','بمنع النقاش حول الحقوق.','بترك الأمر للأسرة فقط.'],a:0},

{q:'ما هو الهدف من "تطوير تجربة الجامعات الشعبية"؟',o:['إلغاء الجامعات النظامية.','تخصيصها للشباب فقط.','منح شهادات معترف بها دولياً.','تعميم المعارف وخلق فضاءات لمناقشة المهارات والمؤهلات المرتبطة بالحياة وقضايا المواطنة.'],a:3},

{q:'ما هو الهدف من "إحداث مسار للتعليم المهني من الإعدادي" في إطار التعلم مدى الحياة؟',o:['إلغاء التعليم العام.','توسيع قاعدة التكوين التقني والمهني لتمكين شرائح واسعة من الاستفادة وفتح المجال للعودة لتحسين التكوين في مختلف مراحل العمر.','توجيه التلاميذ الراسبين فقط.','تقليل عدد سنوات الدراسة.'],a:1},
{q:'كيف يتم تعزيز "الانفتاح على المقاولات" في تكنولوجيا الإعلام والاتصال؟',o:['بمنع الشراكة مع القطاع الخاص.','ببيع المدارس للشركات.','في إطار شراكات مؤسساتية من أجل إسهامها في المجهود العمومي لتطوير البنيات التحتية والتجهيزات.','بالاكتفاء بجهود الدولة.'],a:2},
{q:'كيف يتم "ربط التكوينات المهنية بمشاريع الابتكار التقني"؟',o:['بالاكتفاء بالتكوين النظري.','بتقليل عدد التخصصات.','بإلغاء التدريب الميداني.','بتوفير شبكات متعددة بين مؤسسات التكوين والجامعات والمقاولات على أساس تقاسم ثقافة الإنتاج والابتكار.'],a:3},
{q:'ما هو الهدف من "إحداث برامج لتقييم المؤسسات التربوية"؟',o:['خلق منافسة إيجابية وشريفة بين المؤسسات وتحفيز المتميزة منها وتحسين جودة أدائها.','معاقبة المؤسسات الضعيفة.','خصخصة المؤسسات.','تقليل عدد المؤسسات.'],a:0},
{q:'كيف يتم "تشجيع إحداث محاضن للمقاولات المبدعة"؟',o:['بتوفير التمويل فقط.','بتمكين الطلبة الباحثين من استعمال الموارد البشرية للمؤسسة وتجهيزاتها لتحقيق مشاريعهم والاستفادة من المساعدات والإرشادات.','بمنع الطلبة من إنشاء مقاولات.','بتحويل المؤسسات إلى شركات.'],a:1},
{q:'كيف تساهم المدرسة في "تقوية جهود التنمية المستدامة"؟',o:['بتدريس مادة البيئة فقط.','بتقليل الميزانية الموجهة للبحث.','بتوجيه التكوينات والبحوث العليا نحو غايات ذات صلة بالانتفاع المجتمعي (محاربة الفقر، الهشاشة، المرض، العنف).','بالاكتفاء بالجانب النظري.'],a:2},

const TOTAL_TIME=CONFIG.timePerQuestion,STORAGE_PREFIX='quiz_v3_';
let ci=-1,cq=[],idx=0,score=0,streak=0,answered=false,timeLeft=0,timerId=null,wrongs=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getBest(id){try{const v=localStorage.getItem(STORAGE_PREFIX+id);return v===null?null:parseInt(v,10);}catch(e){return null;}}
function setBest(id,v){try{const c=getBest(id);if(c===null||v>c){localStorage.setItem(STORAGE_PREFIX+id,String(v));return true;}return false;}catch(e){return false;}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}

function renderHome(){
  document.getElementById('appTitle').textContent=CONFIG.title;
  document.getElementById('appSub').textContent=CONFIG.subtitle;
  const box=document.getElementById('chapters');box.innerHTML='';
  CHAPTERS.forEach((ch,i)=>{
    const total=ch.questions.length,best=getBest(ch.id);
    const badge=best!==null?'<span class="ch-badge gold">🏆 أفضل: '+best+'/'+total+'</span>':'<span class="ch-badge">✨ لم تُختبر بعد</span>';
    const card=document.createElement('button');card.className='chapter-card';
    card.innerHTML='<div class="ch-icon">'+(ch.icon||'📄')+'</div><div class="ch-body"><div class="ch-title">'+ch.title+'</div><div class="ch-desc">'+(ch.description||'')+'</div><div class="ch-meta"><span>'+total+' سؤال</span>'+badge+'</div></div><div class="ch-arrow">‹</div>';
    card.onclick=()=>startChapter(i);box.appendChild(card);
  });
}

function startChapter(i){
  ci=i;const ch=CHAPTERS[i];
  cq=ch.questions.map(q=>({q:q.q,o:q.o.slice(),a:q.a}));
  if(CONFIG.shuffleOptions){cq.forEach(item=>{const c=item.o[item.a];shuffle(item.o);item.a=item.o.indexOf(c);});}
  idx=0;score=0;streak=0;wrongs=[];
  document.getElementById('chapterName').textContent=ch.title;
  document.getElementById('streak').classList.remove('show');
  show('quiz');renderQ();
}

function renderQ(){
  answered=false;const q=cq[idx];
  document.getElementById('qnum').textContent='السؤال '+(idx+1)+' / '+cq.length;
  document.getElementById('score').textContent='⭐ '+score;
  document.getElementById('progress').style.width=(idx/cq.length*100)+'%';
  document.getElementById('question').textContent=q.q;
  const box=document.getElementById('options');box.innerHTML='';
  q.o.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>choose(i);box.appendChild(b);});
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('next').style.display='none';
  startTimer();
}

function startTimer(){
  clearInterval(timerId);timeLeft=TOTAL_TIME;
  document.getElementById('timer').textContent=timeLeft;
  const tb=document.getElementById('timebar');tb.style.width='100%';tb.classList.remove('low');
  timerId=setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').textContent=Math.max(timeLeft,0);
    tb.style.width=(Math.max(timeLeft,0)/TOTAL_TIME*100)+'%';
    if(timeLeft<=10)tb.classList.add('low');
    if(timeLeft<=0){clearInterval(timerId);if(!answered)choose(-1);}
  },1000);
}

function choose(i){
  if(answered)return;answered=true;clearInterval(timerId);
  const q=cq[idx],buttons=document.getElementById('options').children;
  for(let k=0;k<buttons.length;k++){const b=buttons[k];b.disabled=true;if(k===q.a)b.classList.add('correct');if(k===i&&i!==q.a)b.classList.add('wrong');}
  const fb=document.getElementById('feedback');
  if(i===q.a){score++;streak++;fb.textContent='✅ إجابة صحيحة!'+(streak>=3?' 🔥 سلسلة '+streak+' متتالية!':' أحسنت.');fb.className='feedback ok';}
  else{streak=0;fb.textContent=(i===-1?'⏰ انتهى الوقت! ':'❌ إجابة خاطئة. ')+'الإجابة الصحيحة: '+q.o[q.a];fb.className='feedback bad';wrongs.push({q:q.q,correct:q.o[q.a]});}
  const stk=document.getElementById('streak');
  if(streak>=3){stk.classList.add('show');document.getElementById('streakNum').textContent=streak;}else stk.classList.remove('show');
  document.getElementById('score').textContent='⭐ '+score;
  const nb=document.getElementById('next');nb.style.display='block';
  nb.textContent=(idx===cq.length-1)?'🏁 عرض النتيجة':'السؤال التالي ➜';
}

function nextQuestion(){if(idx===cq.length-1)endQuiz();else{idx++;renderQ();}}

function fireConfetti(){
  const colors=['#0f9b8e','#4dd0b1','#e8590c','#f0a04b','#25a55f','#ffd700'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    c.style.width=(6+Math.random()*8)+'px';c.style.height=(6+Math.random()*8)+'px';
    c.style.animationDelay=(Math.random()*0.8)+'s';c.classList.add('go');
    document.body.appendChild(c);setTimeout(()=>c.remove(),4000);
  }
}

function endQuiz(){
  clearInterval(timerId);show('end');
  const ch=CHAPTERS[ci],total=cq.length,pct=Math.round(score/total*100);
  const isNew=setBest(ch.id,score);
  document.getElementById('endChapter').textContent=ch.title;
  const bs=document.getElementById('bigscore');bs.textContent=score+' / '+total;
  bs.className='bigscore'+(pct>=90?' celebrate':'');
  document.getElementById('pct').textContent='النسبة: '+pct+'%';
  const bn=document.getElementById('bestNote');
  if(isNew&&score>0){bn.textContent='🎉 رقم قياسي جديد!';bn.className='best-note new';}
  else{const best=getBest(ch.id);bn.textContent=best!==null?'🏆 أفضل نتيجة: '+best+'/'+total:'';bn.className='best-note';}
  let msg='💪 واصل المراجعة، البداية دائماً صعبة.';
  if(pct>=90)msg='🏆 ممتاز! إتقان شبه كامل.';
  else if(pct>=75)msg='🌟 جيد جداً! مستوى متميز.';
  else if(pct>=60)msg='👍 جيد، تحتاج فقط بعض المراجعة.';
  else if(pct>=40)msg='📖 مقبول، راجع المحاور الأساسية.';
  document.getElementById('verdict').textContent=msg;
  const rev=document.getElementById('review');
  if(wrongs.length===0){rev.innerHTML='<h3 style="color:#178a4c">🎉 لا توجد أخطاء! أداء كامل.</h3>';}
  else{rev.innerHTML='<h3>📌 مراجعة الأخطاء ('+wrongs.length+')</h3>'+wrongs.map((w,n)=>'<div class="item"><b>'+(n+1)+'.</b> '+w.q+'<br><span class="ans">✔ '+w.correct+'</span></div>').join('');}
  if(pct>=90)setTimeout(fireConfetti,200);
}

function retryChapter(){if(ci>=0)startChapter(ci);}
function goHome(){clearInterval(timerId);renderHome();show('home');}
function exitQuiz(){if(!confirm('هل تريد الخروج والعودة إلى قائمة الفصول؟ ستفقد تقدمك في هذا الفصل.'))return;goHome();}
renderHome();
</script>
</body></html>
